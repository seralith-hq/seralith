services:
  seralith-control:
    build:
      context: ../..
      dockerfile: deploy/docker/control.Dockerfile
    image: seralith/control:local
    ports:
      - "8080:8080"
    environment:
      SERALITH_CONTROL_BOOTSTRAP_TOKEN: ${SERALITH_CONTROL_BOOTSTRAP_TOKEN:?set a bootstrap token}
    volumes:
      - seralith-data:/var/lib/seralith
    healthcheck:
      test: ["CMD", "/usr/local/bin/seralith-control", "-version"]
      interval: 30s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  seralith-data:
