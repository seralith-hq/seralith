run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - misspell
    - revive
    - gofmt
    - goimports
    - bodyclose
    - errorlint
    - gosec
    - unconvert
    - prealloc

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true
      - name: package-comments
        disabled: true
  gosec:
    excludes:
      - G204
      - G304
      - G306

issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec, errcheck]
