apiVersion: v1
kind: Namespace
metadata:
  name: seralith
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seralith-control-data
  namespace: seralith
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seralith-control
  namespace: seralith
  labels:
    app.kubernetes.io/name: seralith-control
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seralith-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seralith-control
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seralith-control
          image: ghcr.io/ryan-tobin/seralith-control:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERALITH_CONTROL_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: seralith-control
                  key: bootstrap-token
                  optional: true
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/seralith
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seralith-control-data
---
apiVersion: v1
kind: Service
metadata:
  name: seralith-control
  namespace: seralith
spec:
  selector:
    app.kubernetes.io/name: seralith-control
  ports:
    - name: http
      port: 80
      targetPort: http
