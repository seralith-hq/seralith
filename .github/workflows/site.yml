name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "blog/**", "tools/sitedocs/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "blog/**", "tools/sitedocs/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ github.event_name == 'pull_request' && 'site-preview' || 'site-production' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: seralith
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the docs pages
        run: go run ./tools/sitedocs
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Site deploy skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure the Pages project exists
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT }} --production-branch=main
        continue-on-error: true
      - name: Deploy
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ env.PROJECT }} --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.sha }}
