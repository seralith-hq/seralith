name: Feature request
description: Propose an improvement to Sigil
labels: ["type: feature", "status: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: compliance
    attributes:
      label: Is this driven by a compliance requirement?
      options:
        - "No"
        - DoW Instruction 8430.01
        - NIST SP 800-218 (SSDF)
        - EU Cyber Resilience Act
        - CMMC / NIST SP 800-171
        - FedRAMP
        - Other
